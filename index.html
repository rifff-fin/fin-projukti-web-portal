    <!--
      Loader (home page), painted with the first frame, before any script: a small copy of
      the logo whose trace fills along the path as the page gets ready (lib/preloader.ts);
      then the end ball lights and the screen opens in a circle from it.
    -->
    <style>
      html.preloading {
        overflow: hidden;
      }
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #0a0a0b;
        /* if the app never starts, don't hide the page for ever */
        animation: pl-away 0.5s ease 10s forwards;
      }
      #preloader .pl-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
      }
      #preloader svg {
        height: 84px;
        width: auto;
        overflow: visible;
      }
      #preloader .pl-track,
      #preloader .pl-trace {
        fill: none;
        stroke-width: 42;
        stroke-linejoin: round;
      }
      #preloader .pl-track {
        stroke: #1d1d21;
      }
      #preloader .pl-trace {
        stroke: #ff7a1b;
        stroke-dasharray: 1 1;
        stroke-dashoffset: 0.94;
        transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #preloader .pl-foot {
        fill: #1d1d21;
        animation: pl-on 0.35s ease 0.1s forwards;
      }
      #preloader .pl-ball {
        fill: #1d1d21;
        transition: fill 0.2s ease;
      }
      #preloader.is-lit .pl-ball {
        fill: #ff7a1b;
      }
      #preloader .pl-ring {
        fill: none;
        stroke: #ff9a4d;
        stroke-width: 6;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
      }
      #preloader.is-lit .pl-ring {
        animation: pl-ring 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      #preloader .pl-count {
        font: 400 11px/1 'Geist Mono', ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 0.2em;
        color: #8c8c93;
        font-variant-numeric: tabular-nums;
      }
      @keyframes pl-on {
        to {
          fill: #ff7a1b;
        }
      }
      @keyframes pl-ring {
        0% {
          opacity: 0.9;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(2.6);
        }
      }
      @keyframes pl-away {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <div class="pl-mark">
        <svg viewBox="126 64 248 375">
          <path class="pl-track" d="M151.5 404V307.5H247V201.5H342.5V95.5" />
          <path class="pl-trace" d="M151.5 404V307.5H247V201.5H342.5V95.5" pathLength="1" />
          <rect class="pl-foot" x="126" y="391" width="51" height="48" rx="8" />
          <circle class="pl-ball" cx="342.5" cy="95.5" r="31.5" />
          <circle class="pl-ring" cx="342.5" cy="95.5" r="31.5" />
        </svg>
        <span class="pl-count">000</span>
      </div>
    </div>
    <script>
      document.documentElement.classList.add('preloading');
    </script>
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
